<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <header class="hero">
<p class="eyebrow">DISCOVER EXOPLANETS AND THEIR POTENTIAL FOR LIFE</p>
<h1>EXOPLORE</h1>
<p class="subtitle">
Explore strange new worlds beyond our solar system and discover the mysteries of exoplanets, and what they mean for the future of life in the universe.
</p>
<div class="search-box">
    <input
    id="search-input"
    type="text"
    placeholder="Search for a planet by name or type...">
    </div>
    </header>

   
        <div id="planet-grid" class="planet-grid"></div>

    <div id="planet-modal" class="modal" hidden>
        <article class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button id="close-modal" class="close-modal" type="button" aria-label="Close article">×</button>
            <p id="modal-meta" class="modal-meta"></p>
            <h2 id="modal-title"></h2>
            <p id="modal-article"></p>
        </article>
    </div>
    <script src="script.js"></script>
</body>
</html>
